reason = "same partial filelock 4.2.1 fix as GHSA-v4x8-3wr5-3wq8 (Python >= 3.11 only, see that row); the flaw is a Windows-only oplock on SoftFileLock's marker file blocking a stale-lock break, which litellm's Linux-only proxy deployment never hits; remove once 3.10 is dropped or a 3.x fix ships"

