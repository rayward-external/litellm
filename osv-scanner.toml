ignoreUntil = 2026-11-24
reason = "same filelock 4.2.1 fix as GHSA-v4x8-3wr5-3wq8, blocked by the same Python >= 3.11 requirement; the flaw is a Windows-only oplock on SoftFileLock's marker file blocking a stale-lock break, which litellm's Linux-only proxy deployment never hits; remove once 3.10 is dropped or a 3.x fix ships"

[[IgnoredVulns]]
id = "GHSA-9vhv-jxww-xfm5"
ignoreUntil = 2026-11-24
reason = "same filelock 4.2.1 fix as GHSA-v4x8-3wr5-3wq8, blocked by the same Python >= 3.11 requirement; the flaw is a Windows-only TOCTOU in ReadWriteLock's SQLite backend, which litellm never uses (only FileLock); remove once 3.10 is dropped or a 3.x fix ships"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
ignoreUntil = 2026-11-24
reason = "crypto-bigint 0.7.6 (fix) is a breaking major for elliptic-curve, which pins crypto-bigint ^0.5 and is itself pinned to ^0.13.x by p256/p384 via jsonwebtoken 11.1.0's rust_crypto feature; no release of this chain supports crypto-bigint 0.7 yet; remove once one does"

