[[IgnoredVulns]]
id = "GHSA-v4x8-3wr5-3wq8"
ignoreUntil = 2026-11-20
reason = "security sweep 2026-10-25: pyproject.toml now splits the filelock floor on python_version, so Python >= 3.11 resolves to the fixed 4.2.1+ (same pattern as the pillow/lunary rows elsewhere in pyproject.toml); only the Python 3.10 resolution stays on pre-4.2.1 filelock, since 4.2.0+ dropped 3.10 support entirely. The advisory is in ReadWriteLock, which litellm never uses (only FileLock). Remove once 3.10 is dropped or a 3.x fix ships"

[[IgnoredVulns]]
