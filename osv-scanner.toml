id = "RUSTSEC-2023-0071"
ignoreUntil = 2026-11-28
reason = "rsa 0.9.10 (transitive dep of jsonwebtoken 11.1.0, the litellm-gateway-ui crate's JWT handling) has no usable fixed release for the Marvin Attack timing sidechannel; rechecked 2026-11-09, rsa now ships a stable 0.10.0, but jsonwebtoken 11.1.0 (still the latest release) pins `rsa = \"^0.9.6\"` in its own manifest, so `cargo update -p rsa --precise 0.10.0` fails resolution; remove this entry once jsonwebtoken itself releases a version depending on rsa >=0.10"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0440"
ignoreUntil = 2026-12-04
reason = "astral-tokio-tar 0.6.4 is pulled in only by testcontainers 0.27.3 (via testcontainers-modules, a dev-dependency of the spend-clickhouse, storage-clickhouse and db-testing crates), so it is test-only and never shipped in a gateway binary. The advisory is informational (unmaintained, published 2026-11-03, no CVE or exploit): the maintainer ended support for every version, including the 0.7.1 line, and names tar-codec as a replacement; testcontainers 0.28.0 still depends on astral-tokio-tar, so no upstream release avoids it yet. Remove this entry once testcontainers moves off the crate or a maintained release exists"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0441"
ignoreUntil = 2026-12-04
reason = "pin-utils 0.1.1 is an unmaintained crate (repository archived 2026-10-01; informational, no CVE) pulled in by aws-smithy-http 0.64.1, aws-smithy-runtime 1.16.0 and aws-smithy-types 1.8.1, which the AWS SDK crates in litellm-rust use for S3, KMS, STS and Secrets Manager. It is a thin pin! macro helper with no network or parsing surface; no pin-utils release is fixed because the project is archived. Newer aws-smithy releases (http 0.64.3, runtime 1.16.2, types 1.9.1) no longer list pin-utils as a dependency, so a lockfile refresh of those three crates should drop it; remove this entry once the lockfile no longer contains pin-utils"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
ignoreUntil = 2027-02-08
reason = "libsqlite3-sys 0.37.0 (via rusqlite's bundled feature in litellm-cache-disk) bundles a SQLite build before 3.54.0 that can leak uninitialized page-cache memory when a database is opened alongside a sibling -wal file of a different page size (CVE-2026-119375, local attacker who can plant that -wal file). Fixed in libsqlite3-sys 0.39.0, shipped only with rusqlite 0.41, but raising rusqlite past 0.40 requires libsqlite3-sys >=0.38, which collides with the workspace's optional, never-enabled sqlx-sqlite dependency (pulled into Cargo.lock by the sqlx `migrate` feature): sqlx-sqlite 0.9.0 caps libsqlite3-sys at <0.38.0, and Cargo's single `links = \"sqlite3\"` rule enforces that cap project-wide even though no crate activates sqlx's sqlite feature. Remove once sqlx-sqlite raises its own libsqlite3-sys requirement past 0.38, or rusqlite backports the fix to a 0.39.x/0.40.x line still capped below 0.38"
