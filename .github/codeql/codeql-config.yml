name: "LiteLLM CodeQL config"

# Known OOM queries on large Python codebases:
# CodeQL builds a full data flow graph in memory. These two queries trace
# sensitive data through every log call / regex pattern, causing combinatorial
# path explosion on codebases with extensive logging like LiteLLM (>2 GiB
# result sets). This is a known CodeQL scaling limitation, not a code issue.
# Re-test periodically as CodeQL improves or the codebase refactors logging.
query-filters:
  - exclude:
      id: py/clear-text-logging-sensitive-data  # CWE-312
  - exclude:
      id: py/polynomial-redos                   # CWE-730
  # Taint explosion from pervasive logging, same scaling class as
  # py/clear-text-logging-sensitive-data above; hangs the python leg without it.
  - exclude:
      id: py/log-injection                      # CWE-117
  # Tracebacks only reach loggers; ProxyException.to_dict() never serializes a
  # traceback field, so CodeQL cannot distinguish log sinks from HTTP response
  # sinks here.
  - exclude:
      id: py/stack-trace-exposure                # CWE-209
  # Security-critical URL validation uses urlparse() tuple comparison; the
  # flagged startswith/endswith calls are non-security normalization (JWT
  # heuristics, trailing-slash strip), not the sanitization the query targets.
  - exclude:
      id: py/incomplete-url-substring-sanitization  # CWE-184
  # Same FP class as py/incomplete-url-substring-sanitization above, surfaced
  # in ui/litellm-dashboard/**/*.test.tsx files that assert on rendered DOM
  # text via RTL's getByText(/https:\/\/.../) -- not a security decision on an
  # untrusted URL. Not caught by the "tests" paths-ignore below, which only
  # matches the top-level Python tests/ dir.
  - exclude:
      id: js/incomplete-url-substring-sanitization  # CWE-184
  # Every httpx client resolves verify via get_ssl_verify()/get_ssl_configuration()
  # (litellm/llms/custom_httpx/http_handler.py), defaulting to True and only
  # disabled via explicit operator opt-in for enterprise self-signed/internal-CA
  # deployments; CodeQL cannot follow the dynamic default so it flags every call site.
  - exclude:
      id: py/request-without-cert-validation      # CWE-295
  # Fires on test-litellm-ui-lint.yml/test-litellm-ui-unit.yml for checking out
  # PR content + npm ci under pull_request (non-privileged). Runners are
  # ephemeral GitHub-hosted and no workflow_run/pull_request_target job in this
  # repo consumes their artifacts/caches; permissions here are contents: read only.
  - exclude:
      id: actions/untrusted-checkout/medium       # CWE-829
  # _bounded_s3_file_name (litellm/integrations/s3.py) SHA256-hashes a
  # constructed S3 object key (a timestamp + response_id) purely to fit it
  # under the byte budget when the sanitized name is too long -- it is never
  # used for authentication or credential storage. CodeQL's generic
  # sensitive-data classifier flags the taint flow through the request
  # metadata dict built in litellm/proxy/litellm_pre_call_utils.py (which
  # also carries the UserAPIKeyAuth object) as "password" by name heuristics,
  # not by actual content. Confirmed FP on audit of alert #1114.
  - exclude:
      id: py/weak-sensitive-data-hashing          # CWE-327/328/916
  # litellm/proxy/mcp_server/discoverable_endpoints.py's _set_oauth_state_cookie
  # (byte-identical to upstream) stores encode_state_with_base_url()'s output,
  # which is already ciphertext (an encrypted OAuth session blob per its own
  # docstring), in an httponly/secure cookie -- there is no clear-text secret
  # here, just a generically-named "state" variable the query's name-based
  # heuristic flags regardless of its content. Confirmed FP on audit of alert #1133.
  - exclude:
      id: py/clear-text-storage-sensitive-data    # CWE-312/327
  # Same call site as py/clear-text-storage-sensitive-data above: the cookie's
  # distinguishing name component is relay_state, which is secrets.token_urlsafe()
  # output generated server-side before the cookie is set, never user input at
  # this call site. CodeQL's taint tracking can't see past the random-handle
  # indirection documented in the surrounding LIT-4197 comment. Confirmed FP on
  # audit of alert #1134.
  - exclude:
      id: py/cookie-injection                     # CWE-20
  # litellm/proxy/mcp_server/byok_oauth_endpoints.py's BYOK authorization-code
  # redirect (byte-identical to upstream) only reaches redirect_uri after
  # validate_loopback_redirect_uri() rejects anything but localhost/127.0.0.0/8/::1
  # (RFC 8252 native-app pattern), so the redirect target can never leave the
  # user's own machine; CodeQL's taint tracking doesn't model that upstream
  # validation call as a sanitizer. Confirmed FP on audit of alert #1132.
  - exclude:
      id: py/url-redirection                      # CWE-601
  # ui/litellm-dashboard/src/lib/wildcard_routes.ts's substituteCapture (byte-identical
  # to upstream's new 2026-10-31 wildcard-routing module) calls
  # deploymentPattern.replace("*", ...) with a plain-string search, which the query
  # flags because String.replace only touches the first match. Its only caller,
  # routesCapturedIds, gates every invocation on both patterns having exactly one "*"
  # (namePattern.split("*").length === 2 && deploymentPattern.split("*").length === 2),
  # so deploymentPattern can never carry a second "*" for this call to miss. Not a
  # sanitization boundary either: both patterns are admin-authored model_name config,
  # never untrusted/user input. Confirmed FP on audit of alert #1137.
  - exclude:
      id: js/incomplete-sanitization               # CWE-116

paths-ignore:
  - tests
  - docs
  - "**/*.md"
  # Standalone demo pages, not shipped product. Source of the
  # js/clear-text-storage-of-sensitive-data and js/insecure-randomness highs.
  - "scripts/adaptive_router_demo"
  # Example/demo servers and benchmark scripts — not deployed product code.
  # py/reflective-xss and py/regex-injection FPs surfaced from these paths.
  - "cookbook"
  - "scripts/benchmark_*"
  # litellm/proxy/_experimental/out is upstream's own checked-in Next.js static
  # export (production build output, committed by upstream's own "chore: update
  # Next.js build artifacts" bot), not fork- or hand-authored source. Its chunk
  # filenames are content-hashed and change on every UI rebuild, so a per-file
  # exclude or an existing-alert dismissal would just recur under a new hash
  # next sync; the findings are inside minified third-party bundled deps that
  # neither this fork nor upstream's own source can meaningfully patch.
  - "litellm/proxy/_experimental/out"
  # js/clear-text-storage-of-sensitive-data FP: the MCP OAuth access token is
  # held in per-tab window.sessionStorage with a short TTL because the SPA must
  # read it from JS to call MCP servers. sessionStorage is the standard place
  # for this; there is no server-only alternative that keeps the token usable.
  # CodeQL cannot express "accepted, scoped client-side token cache", and a
  # query-filter exclude cannot be scoped to one file, so the file is ignored.
  - "ui/litellm-dashboard/src/utils/mcpTokenStore.ts"
  # Same FP class as mcpTokenStore.ts above, new in upstream's 2026-10-17
  # playground rewrite: persist()'s `else window.sessionStorage.setItem(key,
  # value)` branch only ever runs for fields storedValues() tags
  # `secure: false`; the virtualKey/apiKeySource/customHeaders fields are
  # routed to setSecureItem() on the sibling branch instead. CodeQL's taint
  # tracking can't follow that per-field discriminant and flags the whole
  # settings object (which also carries the secure fields) as reaching the
  # plain-text sink.
  - "ui/litellm-dashboard/src/app/(dashboard)/playground/components/chat/usePlaygroundSettings.ts"
