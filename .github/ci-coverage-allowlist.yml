description: >-
  Paths deliberately outside CI coverage, each with the reason it is exempt.
  assert_ci_coverage.py fails when a test file or Dockerfile is neither invoked
  by a job nor listed here, so every entry below is a decision on the record.

test_paths:
  - reason: ran only in CircleCI, removed
    paths:
      - tests/e2e/migrations/test_legacy.py
      - tests/e2e/migrations/test_pooling.py
      - tests/e2e/migrations/test_recovery.py
      - tests/e2e/migrations/test_rolling_upgrade.py
      - tests/e2e/migrations/test_shaped_database.py
      - tests/e2e/migrations/test_startup.py
      - tests/e2e/migrations/test_upgrade.py
      - tests/integration/database/test_roi_observed.py
  - reason: >-
      Orphaned when PR #45509 moved the CircleCI llm_responses_api_testing job's suites to GHA
      without porting these two files. Both currently fail outside the CircleCI job's old
      fixtures (10 of 31 failures in test_responses_hooks.py, 1 of 11 in
      test_base_responses_api_streaming_iterator.py), so wiring them into a GHA shard as-is would
      turn it red on tests this PR did not break. Needs separate triage of each failure before
      they can be assigned a job.
    paths:
      - tests/llm_responses_api_testing/test_base_responses_api_streaming_iterator.py
      - tests/llm_responses_api_testing/test_responses_hooks.py
  - reason: >-
      litellm.agent() end-to-end suite. It drives the real claude, codex, opencode and pi CLIs and
      deepagents against a live LiteLLM AI Gateway, so it needs those binaries on PATH plus
      LITELLM_PROXY_API_BASE / LITELLM_PROXY_API_KEY, and skips without them. Run manually
      before changing litellm/harness; the mocked coverage runs in tests/unit/harness and
      tests/unit/llms/*/harness
    paths:
      - tests/harness_e2e
  - reason: >-
      Databricks end-to-end suite: its own module docstring says it needs real Databricks
      credentials and makes actual API calls, and its module-level pytestmark unconditionally
      skips every test in CI. The mocked coverage runs in test_databricks_partner_integration.py.
    paths:
      - tests/unit/skills/test_databricks_e2e.py
  - reason: >-
      The Rust/Python parity harness is run manually through its local CLI. Recorded replay,
      fixture generation, and harness checks are intentionally outside pull request CI
    paths:
      - tests/rust-python-harness
  - reason: >-
      Owned by the open pull request that moves the Rust/Python parity checks (#45135). It ran in
      the retired build_and_test job that globbed tests/test_*.py,
      and that pull request gives it a new home
    paths:
      - tests/test_rust_python_harness.py
  - reason: >-
      The end-to-end suite runs against a deployed proxy from its own in-cluster rig rather than
      from a pull request; it needs a live gateway and provider credentials no PR job holds
    paths:
      - tests/e2e
  - reason: >-
      The documentation and code-quality workflows execute four files in this directory by name as
      scripts and pytest never collects the directory, so these six run nowhere; listed individually
      so a seventh cannot inherit the exemption
    paths:
      - tests/documentation_tests/test_exception_types.py
      - tests/documentation_tests/test_general_setting_keys.py
      - tests/documentation_tests/test_optional_params.py
      - tests/documentation_tests/test_readme_providers.py
      - tests/documentation_tests/test_requests_lib_usage.py
      - tests/documentation_tests/test_standard_logging_payload.py
  - reason: >-
      Named like a test but shaped like a benchmark: it fetches live image URLs, times aiohttp
      against httpx, prints the ratio, and asserts nothing, so pytest cannot collect it (its
      functions take arguments, not fixtures) and running it beside its siblings in the
      code-quality workflow would add a network dependency for a number nothing reads. Exempt
      as a script rather than as an unresolved gap; revisit by deleting it once the aiohttp
      choice it informed is settled
    paths:
      - tests/code_coverage_tests/test_aio_http_image_conversion.py
  - reason: >-
      Third-party integration tests that skip themselves without OCI configuration or sandbox
      credentials, neither of which a pull request job holds
    paths:
      - tests/integration/sandbox/test_e2b_sandbox.py
      - tests/integration/test_oci_integration.py
      - tests/integration/test_oci_proxy_integration.py
  - reason: >-
      False negative in assert_ci_coverage.py's own ignore-token extraction, not an actual gap:
      the responses-caching-types shard in test-unit.yml names this file directly and runs it,
      but also carries this fork's --deselect of one specific test within it
      (TestWebSocketTurnAdmission::test_managed_relay_sends_the_provider_only_the_metadata_each_turn_carries).
      TEST_TOKEN_RE strips the "::"-qualified test name down to the bare file path when scanning
      the --deselect argument, so the file lands in both the included and ignored token sets and
      covers_test() reports it as uncovered even though pytest collects and runs every other test
      in it. test_openapi_compliance.py's own per-test --deselects (test-unit.yml) don't trip this
      because that file is also named directly in interactions-spec-canary.yml, a second, clean
      reference with no deselect to poison it; this file has no such second reference.
    paths:
      - tests/unit/responses/test_responses_websocket_all_providers.py
  - reason: >-
      Same false negative as the test_responses_websocket_all_providers.py entry above: the
      llms-providers shard in test-unit.yml includes this file only via its parent directory
      (tests/unit/llms/opencode), but also carries this fork's 2026-11-14 quarantine --deselect of
      one specific parametrized test
      (test_reported_list_cost_is_billed_instead_of_rows[chat-chat/completions]). TEST_TOKEN_RE
      strips the "[...]"-qualified test name down to the bare file path when scanning the
      --deselect argument, so the file lands in both the included and ignored token sets and
      covers_test() reports it as uncovered even though pytest collects and runs every other test
      in it.
    paths:
      - tests/unit/llms/opencode/chat/test_transformation.py

dockerfiles:
  - reason: >-
      The Rust gateway image compiles the whole workspace in release mode, which is too slow for
      a per-pull-request job while the gateway binary is still being assembled; the Rust lint,
      clippy, and compile jobs already cover the code it packages. Revisit when the gateway is
      published
    paths:
      - litellm/rust/crates/gateway/Dockerfile
