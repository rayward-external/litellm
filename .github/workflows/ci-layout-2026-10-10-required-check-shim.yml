name: "CI layout 2026-10-10 (required-check shim)"
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - litellm_internal_staging
      - litellm_oss_staging
      - "litellm_**"

# Upstream's "ci: finish the lint, unit and smoke check layout" (#45706, absorbed
# by the 2026-10-10 sync) inlined test-unit.yml's per-shard reusable-workflow
# calls into direct jobs, dropping the "<shard> / Run tests" check-name suffix
# those calls used to produce, and additionally merged several previously
# separate semantically-grouped proxy test workflows' "<name> / Run tests"
# checks into the same matrix as bare "<name>" jobs (continuing the fold-in
# proxy-legacy-required-check-shim.yml already describes). It also deleted the
# whole lint-budget-ratchet system (scripts/budget_ratchet_check.py and friends)
# and renamed the docs job from "documentation" to "docs". litellm_internal_staging's
# branch protection still lists the old names below as required status checks,
# which can now never report on any PR -> every PR is permanently blocked from
# merging ("25 of 54 required status checks are expected", caught merging the
# 2026-10-08/2026-10-10 sync PR #300). This shim reproduces only the job
# name/matrix shape so the required checks can report; same pattern as
# server-root-path-required-check-shim.yml, proxy-legacy-required-check-shim.yml,
# and model-prices-json-required-check-shim.yml.
#
# Real coverage today:
#   - "All Other Providers / Run tests" -> split into test-unit.yml's
#     llms-anthropic, llms-bedrock, llms-providers shards (Vertex AI got its own
#     line below; OpenAI/Meta already shimmed separately is not needed, it
#     reports as llms-openai-meta directly)
#   - "Vertex AI / Run tests" -> test-unit.yml's llms-vertex-ai shard
#   - "budget-ratchet" -> gone; no replacement, the ratchet system was deleted
#   - "documentation" -> test-unit.yml's docs job
#   - "misc / Run tests" -> dispersed across test-unit.yml's expanded shard
#     matrix (tests/test_litellm/test_*.py and tests/unit/test_*.py no longer
#     run as one shard)
#   - every other "<name> / Run tests" below -> test-unit.yml's bare "<name>"
#     shard (same job, the reusable-workflow call was just inlined)
#
# REMOVAL CONDITION: remove once an admin updates litellm_internal_staging's
# required status checks (Settings > Branches) to drop these obsolete contexts
# (renaming each "<name> / Run tests" entry to its bare "<name>" counterpart
# where one now exists for real, and dropping "budget-ratchet", "documentation",
# "All Other Providers / Run tests", "Vertex AI / Run tests" and
# "misc / Run tests" outright in favor of the real jobs/shards named above).
jobs:
  matrix-shim:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        check-name:
          - "All Other Providers / Run tests"
          - "Vertex AI / Run tests"
          - "auth-checks / Run tests"
          - "budgets / Run tests"
          - "core-utils / Run tests"
          - "custom-logging / Run tests"
          - "db-and-spend / Run tests"
          - "endpoints-and-responses / Run tests"
          - "enterprise-routing / Run tests"
          - "guardrails-hooks / Run tests"
          - "integrations / Run tests"
          - "jwt-and-keys / Run tests"
          - "key-generation / Run tests"
          - "logging-misc / Run tests"
          - "misc / Run tests"
          - "proxy-auth / Run tests"
          - "proxy-endpoints / Run tests"
          - "proxy-infra / Run tests"
          - "proxy-runtime / Run tests"
          - "proxy-server / Run tests"
          - "proxy-server-core / Run tests"
          - "proxy-utils / Run tests"
          - "responses-caching-types / Run tests"
    name: ${{ matrix.check-name }}
    steps:
      - name: Shim - see fork-patches.txt
        run: |
          echo "Required-check shim for '${{ matrix.check-name }}', a name upstream's CI layout no longer produces."
          echo "See this workflow's own header comment and .github/fork-patches.txt for where real coverage lives now."

  budget-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Shim - see fork-patches.txt
        run: |
          echo "Required-check shim for 'budget-ratchet'. Upstream deleted the whole lint-budget-ratchet system; there is no replacement."
          echo "See .github/fork-patches.txt."

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Shim - see fork-patches.txt
        run: |
          echo "Required-check shim for 'documentation'. Real coverage now lives in test-unit.yml's docs job."
          echo "See .github/fork-patches.txt."
