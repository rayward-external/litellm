name: Dependabot alert sync

# Fork-only. Mirrors osv-scanner.toml triage onto GitHub Dependabot alerts
# (.github/scripts/sync_dependabot_alerts.py): an alert covered by an unexpired
# osv-scanner.toml entry is dismissed as tolerable_risk with the entry's reason;
# an alert this job dismissed is reopened once its entry is removed or expires;
# every alert it cannot cover is listed and fails the run.
#
# Why a workflow: neither the Actions GITHUB_TOKEN nor the maintenance agent's
# app token can read Dependabot alerts, so without this every triaged advisory
# stays OPEN on the Security tab and hides new ones. The daily security sweep
# reads this job's latest run as its GitHub-side ground truth, triages through
# osv-scanner.toml, and dispatches this job after merging. It never dismisses
# alerts itself; this job is the only writer.
#
# Needs repo secret DEPENDABOT_ALERTS_TOKEN: a fine-grained token scoped to
# this repository with "Dependabot alerts: Read and write".

on:
  schedule:
    - cron: "37 1 * * *"
  push:
    branches:
      - main
    paths:
      - osv-scanner.toml
      - "**/uv.lock"
      - "**/package-lock.json"
      - "**/Cargo.lock"
      - .github/scripts/sync_dependabot_alerts.py
      - .github/workflows/dependabot-alert-sync.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the plan without dismissing or reopening anything"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: dependabot-alert-sync
  cancel-in-progress: false

jobs:
  sync:
    name: dependabot-alert-sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Sync osv-scanner.toml triage to Dependabot alerts
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 .github/scripts/sync_dependabot_alerts.py "${args[@]}"
