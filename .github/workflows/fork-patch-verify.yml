name: Fork Patch Verify

# The "daily-patch-verify" .github/fork-patches.txt's own header has described
# since the manifest was created, and that nothing implemented until now --
# see rayward-internal/llm-gateway-infra#694. Runs scripts/verify_fork_patches.py,
# which checks every recorded fork patch is still present in its file, so a
# -X theirs upstream sync that silently drops one (no merge conflict, since it
# never conflicts textually with the surrounding diff) is caught here instead
# of surfacing as a build break days or weeks later -- exactly what happened
# with the digest-pin drift fixed in rayward-external/litellm#239.

on:
  pull_request:
    branches:
      - main
      - litellm_internal_staging
      - litellm_oss_staging
      - "litellm_**"
    # Deliberately NO paths filter: the whole point is catching a patch that
    # silently disappeared from some file a PR touched for an unrelated
    # reason (a -X theirs sync, most of all) -- not just edits to the
    # manifest or this script itself. The check itself is a few hundred
    # milliseconds of file reads, so running it on every PR costs nothing.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify-fork-patches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify every fork-patches.txt row is still present
        run: python3 scripts/verify_fork_patches.py
