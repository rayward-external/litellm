# Shim for the required status check "Verify schema.d.ts matches the proxy
# OpenAPI spec" on litellm_internal_staging's branch protection.
#
# That name used to be a standalone path-filtered workflow
# (.github/workflows/check-ui-api-types.yml), with this file as its
# path-inverted complement so the required context could still report on PRs
# that don't touch the filtered paths. Upstream's CI reorg (ci: render lint,
# unit and smoke checks as <tier> / <job> with one collector per tier, #45480,
# absorbed by a 2026-10-xx sync) inlined check-ui-api-types.yml's job into
# test-linting.yml as the unconditional "ui-api-types" job (same path-gated
# logic internally, via steps.changes.outputs.relevant), deleting the
# standalone workflow outright. With no real workflow left to ever produce the
# literal "Verify schema.d.ts matches the proxy OpenAPI spec" context, the
# path-filtered complement below went the same way as
# ci-layout-2026-10-10-required-check-shim.yml's other legacy names: any PR
# touching ui/litellm-dashboard/package.json (e.g. dependabot npm bumps, see
# PR #329) fell inside this file's old paths-ignore list, so the complement
# skipped itself expecting the real check to report under the same name, and
# nothing ever did -> permanently blocked ("expected" but never reported).
#
# Fix: run this shim unconditionally. Real schema/OpenAPI-sync coverage lives
# entirely in test-linting.yml's "ui-api-types" job now, independent of this
# file, so there is no longer a "real" workflow this complement needs to defer
# to for any path.
#
# Mirrors the infra repo's required-checks-complement.yml (llm-gateway-infra
# PR #261).
#
# REMOVAL CONDITION: remove once an admin updates litellm_internal_staging's
# required status checks (Settings > Branches) to require "ui-api-types"
# instead of "Verify schema.d.ts matches the proxy OpenAPI spec".
name: required-checks-complement-ui-api-types

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  check-sync:
    name: "Verify schema.d.ts matches the proxy OpenAPI spec"
    runs-on: ubuntu-latest
    steps:
      - run: echo "Real schema/OpenAPI-sync coverage lives in test-linting.yml's ui-api-types job; this shim only satisfies the legacy required-check name."
